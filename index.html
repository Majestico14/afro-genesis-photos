<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101410"><title>AFRO GENESIS — Galerie officielle</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f6f3e9;background:#101410}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:56px 18px 38px;background:radial-gradient(ellipse at top,#273f2d,#101410 65%)}.eyebrow{color:#e9c65c;letter-spacing:.3em;font-size:12px}h1{font-size:clamp(42px,9vw,92px);margin:16px 0 8px;line-height:1;letter-spacing:-.05em}h1 em{color:#e5c45b;font-style:normal}.subtitle{letter-spacing:.18em;font-size:13px}header p{color:#c3c9bd;line-height:1.6}.bar{max-width:1200px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.count{color:#cbd1c4}.gallery{max-width:1200px;margin:auto;padding:0 16px 70px;columns:4 220px;column-gap:12px}.tile{display:block;break-inside:avoid;position:relative;margin-bottom:12px;cursor:pointer;background:#263027;border-radius:10px;overflow:hidden;border:0;padding:0;width:100%}.tile img{display:block;width:100%;height:auto}.tile:focus-visible{outline:3px solid #e5c45b}.tile:hover img{filter:brightness(.85)}dialog{border:0;background:#101410;color:white;max-width:none;max-height:none;width:100vw;height:100dvh;padding:0;margin:0}dialog::backdrop{background:#000e}.viewer{height:100%;display:flex;flex-direction:column}.viewerbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:12px}.viewerimg{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;padding:8px 15px}.viewerimg img{max-height:100%;max-width:100%;object-fit:contain}.btn{background:#e5c45b;color:#101410;border:0;border-radius:7px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.close{background:#2d352e;color:#fff}footer{text-align:center;color:#abb6a9;padding:22px;border-top:1px solid #2a352c;font-size:13px}@media(max-width:480px){header{padding-top:40px}.gallery{columns:2 135px;column-gap:8px;padding:0 8px 45px}.tile{margin-bottom:8px}.viewerbar{padding:10px}.btn{padding:10px}}
</style></head><body><header><div class="eyebrow">MAJESTICO PRÉSENTE</div><h1>AFRO <em>GENESIS</em></h1><div class="subtitle">RELEASE PARTY · 21.11.2026</div><p>Revivez les moments de cette soirée.<br>Choisissez vos photos et téléchargez-les gratuitement.</p></header><div class="bar"><strong>GALERIE OFFICIELLE</strong><span class="count" id="count">Chargement des photos…</span></div><main class="gallery" id="gallery"></main><dialog id="modal"><div class="viewer"><div class="viewerbar"><span id="position"></span><div style="display:flex;gap:8px"><a id="download" class="btn" download>Télécharger cette photo ↓</a><button class="btn close" id="close">Fermer ✕</button></div></div><div class="viewerimg"><img id="large" alt="Photo de la release party AFRO GENESIS"></div></div></dialog><footer>AFRO GENESIS · MAJESTICO 🇧🇯 👑</footer><script>
let photos=[],current=0;const gallery=document.getElementById('gallery'),modal=document.getElementById('modal');function show(i){current=i;document.getElementById('large').src=photos[i].full;document.getElementById('download').href=photos[i].full;document.getElementById('position').textContent=`Photo ${i+1} / ${photos.length}`;if(!modal.open)modal.showModal()}document.getElementById('close').onclick=()=>modal.close();document.addEventListener('keydown',e=>{if(!modal.open)return;if(e.key==='ArrowRight')show((current+1)%photos.length);if(e.key==='ArrowLeft')show((current-1+photos.length)%photos.length)});fetch('photos.json').then(r=>r.json()).then(data=>{photos=data;document.getElementById('count').textContent=`${data.length} photos · Téléchargement individuel`;data.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label',`Voir photo ${i+1}`);const img=document.createElement('img');img.src=p.thumb;img.loading='lazy';img.alt=`Photo ${i+1} de la release party`;b.appendChild(img);b.onclick=()=>show(i);gallery.appendChild(b)})});
</script></body></html>
